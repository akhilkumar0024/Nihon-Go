  <!-- Warm soft terracotta sun circle -->
  <circle cx="50" cy="48" r="28" fill="#D97358" opacity="0.18"/>
  <circle cx="50" cy="48" r="22" fill="#D97358" opacity="0.25"/>

  <!-- Friendly Torii Shrine Gate with rounded joinery -->
  <!-- Upper Kasagi curved beam -->
